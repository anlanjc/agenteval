[project]
name = "agenteval"
version = "0.1.0"
description = "自研 Agent 评测与可观测平台：trace / LLM-as-judge 校准 / 回归门禁 / 报告"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
